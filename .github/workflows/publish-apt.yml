name: Publish APT repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. release-3.4.9-linux1)'
        required: true
  release:
    types: [published]

concurrency:
  group: publish-apt
  cancel-in-progress: false

permissions:
  contents: read

env:
  GNUPGHOME: ${{ github.workspace }}/.gnupg
  BUCKET: guysinc-apt
  # The repository lives under a per-project prefix so that each project keeps
  # its own dists/ and pool/, signed by its own subkey. An apt repository has
  # exactly one signing key, so sharing one across projects would force every
  # project's CI to hold the same key - which is what the per-project subkeys
  # exist to avoid. Key and landing page stay at the bucket root, shared.
  PREFIX: github-desktop

jobs:
  publish:
    name: Sign & publish to apt.guysinc.pub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (reprepro conf + public key)
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg unzip curl
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Import GPG signing subkey
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download .deb assets from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p incoming
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir incoming
          ls -la incoming

      - name: Pull existing repo state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p repo
          aws s3 sync "s3://$BUCKET/$PREFIX" repo \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" || true

      - name: Prepare reprepro config
        run: |
          mkdir -p repo/conf
          cp apt/conf/distributions repo/conf/distributions

      - name: Include packages (signs Release / InRelease)
        run: |
          shopt -s nullglob
          for deb in incoming/*.deb; do
            echo "Adding $deb"
            reprepro -b repo includedeb stable "$deb"
          done
          reprepro -b repo export
          echo "--- repo contents ---"
          reprepro -b repo list stable || true

      - name: Publish the public key into the repo tree
        run: |
          mkdir -p shared
          cp apt/guysinc-apt.asc shared/guysinc-apt.asc
          gpg --dearmor < apt/guysinc-apt.asc > shared/guysinc-apt.gpg
          cp apt/index.html shared/index.html

      - name: Remove previously published working state from the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Earlier runs synced the whole working directory, so reprepro's Berkeley
          # DB and its config were served publicly. The sync below now excludes
          # them, but `aws s3 sync` never deletes, so the old objects need removing
          # once. Harmless to repeat.
          # db/ and conf/ are reprepro's working state, published by earlier runs.
          # dists/ and pool/ at the bucket ROOT are the pre-prefix layout, replaced
          # by $PREFIX/. Nothing has ever been installed against the old paths, so
          # removing them breaks no one - and this is the only moment that is true.
          for stale in db conf dists pool; do
            aws s3 rm "s3://$BUCKET/$stale" --recursive \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done

      - name: Sync repository to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # conf/ and db/ are reprepro's own working state. They are needed on
          # disk for the commands above and have no business in a public bucket:
          # anyone mirroring the repository would copy them.
          aws s3 sync repo "s3://$BUCKET/$PREFIX" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --exclude 'conf/*' --exclude 'db/*' \
            --no-progress
          # Public key and landing page are shared across every project's
          # repository, so they sit at the root rather than inside one prefix.
          aws s3 sync shared "s3://$BUCKET" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress
          echo "Published to https://apt.guysinc.pub/${PREFIX}/"
