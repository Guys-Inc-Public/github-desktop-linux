name: Publish APT repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. release-3.4.9-linux1)'
        required: true
  release:
    types: [published]

concurrency:
  group: publish-apt
  cancel-in-progress: false

permissions:
  contents: read

env:
  GNUPGHOME: ${{ github.workspace }}/.gnupg
  BUCKET: guysinc-apt
  # The repository lives under a per-project prefix so that each project keeps
  # its own dists/ and pool/, signed by its own subkey. An apt repository has
  # exactly one signing key, so sharing one across projects would force every
  # project's CI to hold the same key - which is what the per-project subkeys
  # exist to avoid. Key and landing page stay at the bucket root, shared.
  PREFIX: github-desktop

jobs:
  publish:
    name: Sign & publish to apt.guysinc.pub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (reprepro conf + public key)
        uses: actions/checkout@v7

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg unzip curl
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Import GPG signing subkey
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf 'allow-preset-passphrase\nallow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent

          # reprepro signs through gpgme, which has no way to be handed a
          # passphrase - it can only ask an agent. With no TTY in CI that ends as
          # "Pinentry: Inappropriate ioctl for device" and a failed export. So
          # prime the agent up front with the signing subkey's keygrip instead.
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            KEYGRIP=$(gpg --batch --with-keygrip --list-secret-keys --with-colons \
                      | awk -F: '$1=="ssb"{s=1;next} s&&$1=="grp"{print $10; s=0}')
            if [ -z "$KEYGRIP" ]; then
              echo "::error::No signing subkey found in the imported secret."
              exit 1
            fi
            printf '%s' "$APT_GPG_PASSPHRASE" \
              | /usr/lib/gnupg/gpg-preset-passphrase --preset "$KEYGRIP"
          fi

          # Only a signing subkey belongs in CI. A stubbed primary and a real one
          # both report caps=cSC in field 12; field 15 is what separates them,
          # "#" meaning no private material is present.
          if gpg --batch --list-secret-keys --with-colons \
            | awk -F: '$1=="sec" && $12 ~ /c/ && $15 != "#" {found=1} END{exit !found}'; then
            echo "::error::The imported secret carries private material for a certify-capable key."
            exit 1
          fi
          gpg --list-secret-keys --keyid-format=long

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download .deb assets from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p incoming
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir incoming
          ls -la incoming

      - name: Pull existing repo state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p repo
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # This step used to end in `|| true`. A failed pull therefore looked
          # exactly like an empty repository: reprepro would add the one incoming
          # package, export, and the sync would overwrite dists/ with a
          # single-package index. Every previously published version silently
          # stops being listed, and the run stays green.
          #
          # So: let a genuine failure fail, and separately catch the case where
          # the remote has content but nothing arrived - which a zero exit code
          # alone would not reveal.
          remote=$(aws s3 ls "s3://$BUCKET/$PREFIX/" --recursive --endpoint-url "$endpoint" | wc -l)
          aws s3 sync "s3://$BUCKET/$PREFIX" repo --endpoint-url "$endpoint" --no-progress
          pulled=$(find repo -type f | wc -l)
          echo "remote objects: $remote, pulled: $pulled"

          if [ "$remote" -gt 0 ] && [ "$pulled" -eq 0 ]; then
            echo "::error::Remote holds $remote objects but none were pulled. Refusing to"
            echo "::error::republish, which would drop every existing package from the index."
            exit 1
          fi

      - name: Prepare reprepro config
        run: |
          mkdir -p repo/conf
          cp apt/conf/distributions repo/conf/distributions

      - name: Rebuild the package database from the pulled pool
        run: |
          set -euo pipefail
          # reprepro's db/ is its own working state and is deliberately not
          # published - earlier runs served it publicly, and the sync now
          # excludes it. But `export` writes dists/ from the *database*, not
          # from the pool, and the database is the one thing the pull cannot
          # bring back. Every run therefore starts with an empty db and
          # regenerates the indexes from only what it included itself.
          #
          # Today that is invisible: all three architectures ship in one run,
          # and reprepro keeps a single version per package anyway. It stops
          # being invisible the moment a run publishes a subset - one
          # architecture failing to build, a re-publish of a single asset, or a
          # second package in the repository. Measured: publish both arches at
          # 3.4.9, then amd64 only at 3.4.10, and arm64's index comes back
          # *empty* while the run stays green. That is the same failure the
          # state-pull guard above exists to prevent, arriving by another route.
          #
          # So reconstruct the database from what the bucket already holds,
          # before adding anything new. reprepro exits 0 and skips a package it
          # already has, so this is safe to repeat, and it does not remove the
          # pool file it is reading from.
          restored=0
          if [ -d repo/pool ]; then
            while IFS= read -r -d '' deb; do
              reprepro -b repo includedeb stable "$deb"
              restored=$((restored + 1))
            done < <(find repo/pool -name '*.deb' -type f -print0 | sort -z)
          fi
          echo "restored $restored package(s) from the pool"

      - name: Include packages (signs Release / InRelease)
        run: |
          shopt -s nullglob
          for deb in incoming/*.deb; do
            echo "Adding $deb"
            reprepro -b repo includedeb stable "$deb"
          done
          reprepro -b repo export

      - name: Check every architecture is still listed
        run: |
          set -euo pipefail
          # The failure this guards against is silent by construction: an empty
          # index is a valid, correctly signed index. Nothing downstream can
          # tell it from a repository that genuinely has no packages, so the
          # check belongs here, while the pool is still around to compare with.
          architectures=$(awk -F': *' '/^Architectures:/ {print $2}' repo/conf/distributions)
          suite=$(awk -F': *' '/^Codename:/ {print $2}' repo/conf/distributions)
          failed=0
          for arch in $architectures; do
            index="repo/dists/${suite}/main/binary-${arch}/Packages"
            # grep -c prints 0 *and* exits 1 when a file has no matches, so a
            # `|| echo 0` fallback appends a second count and the comparison
            # below silently stops working. Ask about the file first.
            listed=0
            if [ -f "$index" ]; then
              listed=$(grep -c '^Package:' "$index" || true)
            fi
            pooled=$(find repo/pool \( -name "*_${arch}.deb" -o -name '*_all.deb' \) -type f | wc -l)
            echo "${arch}: ${listed} listed, ${pooled} in pool"
            if [ "$pooled" -gt 0 ] && [ "$listed" -eq 0 ]; then
              echo "::error::${arch} has ${pooled} package(s) in the pool but an empty index."
              echo "::error::Publishing this would unlist every ${arch} package."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]
          echo "--- repo contents ---"
          reprepro -b repo list stable || true

      - name: Publish the public key into the repo tree
        run: |
          mkdir -p shared
          cp apt/guysinc-apt.asc shared/guysinc-apt.asc
          gpg --dearmor < apt/guysinc-apt.asc > shared/guysinc-apt.gpg
          cp apt/index.html shared/index.html

      - name: Remove previously published working state from the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Earlier runs synced the whole working directory, so reprepro's Berkeley
          # DB and its config were served publicly. The sync below now excludes
          # them, but `aws s3 sync` never deletes, so the old objects need removing
          # once. Harmless to repeat.
          # db/ and conf/ are reprepro's working state, published by earlier runs.
          # dists/ and pool/ at the bucket ROOT are the pre-prefix layout, replaced
          # by $PREFIX/. Nothing has ever been installed against the old paths, so
          # removing them breaks no one - and this is the only moment that is true.
          for stale in db conf dists pool; do
            aws s3 rm "s3://$BUCKET/$stale" --recursive \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done

      - name: Sync repository to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # conf/ and db/ are reprepro's own working state. They are needed on
          # disk for the commands above and have no business in a public bucket:
          # anyone mirroring the repository would copy them.
          aws s3 sync repo "s3://$BUCKET/$PREFIX" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --exclude 'conf/*' --exclude 'db/*' \
            --no-progress
          # Public key and landing page are shared across every project's
          # repository, so they sit at the root rather than inside one prefix.
          aws s3 sync shared "s3://$BUCKET" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress
          echo "Published to https://apt.guysinc.pub/${PREFIX}/"
